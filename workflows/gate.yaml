# workflows/gate.yaml — per-push gate for handl-lang/docs.
#
# docs is the VitePress documentation hub (bun + vitepress). Its real
# build is `bun run docs:build` = `docs:vendor` (python3
# scripts/vendor-docs.py — vendors sibling repos' docs/site trees, so
# the worktree needs the ../<repo> sibling layout → ensure-siblings)
# + `vitepress build .`. A broken page/sidebar/vendor script fails
# the gate. This is the workflows/gate.yaml port of that contract:
# init → ensure → build → report.
#
# Note: this repo's bupha.toml is the docs-deploy watcher (it fans
# pushes out to ci/trigger.sh for the gh-pages deploy) — a different
# concern from this per-push build gate.
#
# Bupha/the fleet runner invokes:
#
#   GATE_REPO="$PWD" GATE_RESULTS="$PWD/.gate-results.jsonl" \
#     peregrin campaign run workflows/gate.yaml --result .ci-result.json
#
# Verdict: .ci-result.json `.conclusion` == "success" (result: rules map
# gate.pass/gate.fail + failure events).
name: gate-docs

result:
  - event: gate.pass
    conclusion: success
  - event: gate.fail
    conclusion: failure
  - event: gate.failed
    conclusion: failure
  - event: gate.init.failed
    conclusion: failure
  - event: ensure.failed
    conclusion: failure

capabilities:
  env:
    - GATE_REPO
    - GATE_RESULTS
    - GATE_TARGET_DIR
    - GATE_ENV_FILE

nodes:
  # --- init: validate inputs, fresh results file --------------------
  - id: gate.init
    driver: shell
    on: [start]
    emits: [gate.due, gate.init.failed]
    params:
      cmd: >-
        set -u;
        REPO="${config.gate.repo:-${env("GATE_REPO","")}}";
        [ -n "$REPO" ] || { echo "gate.repo is required — set GATE_REPO or config.gate.repo to an absolute checkout path"; exit 1; };
        [ -d "$REPO" ] || { echo "no such directory: $REPO"; exit 1; };
        RES="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/docs.results.jsonl")}}";
        mkdir -p "$(dirname "$RES")";
        : > "$RES";
        echo "gate-docs: repo=$REPO results=$RES"
      timeout: 60
      emit:
        "0": gate.due
        default: gate.init.failed

  # --- ensure: worktree sibling layout (vendor-docs reads ../<repo>)
  - include: tamias:handl-gates@0.3.3//lib/ensure-siblings.node.yml
    id: gate.ensure
    on: [gate.due]
    emits: [ensure.done, ensure.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      target_dir: '${config.gate.target_dir:-${env("GATE_TARGET_DIR","auto")}}'
      env_file: '${config.gate.env_file:-${env("GATE_ENV_FILE","auto")}}'
      emit:
        "0": ensure.done
        default: ensure.failed

  # --- build: bun install + vendor + vitepress build ---------------
  - id: gate.build
    driver: shell
    on: [ensure.done]
    emits: [gate.done, gate.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      results: '${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/docs.results.jsonl")}}'
      timeout: 3600
      cmd: |
        set -uo pipefail
        REPO="${params.repo}"
        RESULTS="${params.results}"
        START=$(date +%s)
        cd "$REPO" || exit 1
        REPO="$(pwd)"
        export PATH="$HOME/.bun/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
        command -v bun >/dev/null 2>&1 || { echo "bun not on PATH"; exit 1; }
        bun install --frozen-lockfile
        bun run docs:build
        rc=$?
        if [ -n "$RESULTS" ]; then
          esc=$(printf '%s' "$REPO" | sed 's/\\/\\\\/g; s/"/\\"/g')
          printf '{"family":"docs","repo":"%s","rc":%s,"secs":%s}\n' "$esc" "$rc" "$(( $(date +%s) - START ))" >> "$RESULTS" 2>/dev/null || true
        fi
        exit $rc
      emit:
        "0": gate.done
        default: gate.failed

  # --- report: terminal verdict from the results record -------------
  - id: gate.report
    driver: shell
    on: [gate.done, gate.failed]
    emits: [gate.pass, gate.fail]
    params:
      cmd: >-
        set -u;
        F="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/docs.results.jsonl")}}";
        [ -s "$F" ] || { echo "no results record — gate produced nothing"; exit 1; };
        line=$(tail -n 1 "$F");
        rc=$(printf '%s' "$line" | sed -n 's/.*"rc":\([0-9][0-9]*\).*/\1/p');
        echo "gate-docs verdict: $line";
        [ "${rc:-1}" = "0" ]
      timeout: 60
      emit:
        "0": gate.pass
        default: gate.fail
