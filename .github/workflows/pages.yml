name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [docs-changed]

# Pages is configured with build_type=branch serving the gh-pages branch,
# so the deploy is a plain `git push` — contents: write is all it needs.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # PAT with read access to the private sibling repos so the reference
      # can be aggregated. Post-restructure the sources are spread over the
      # whole org (`lib-*`, `host-*`, `kernel`, …) — the set is resolved
      # from `gh repo list`, not a hardcoded name list.
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
      GH_TOKEN: ${{ secrets.CI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: auth for private sibling repos
        run: |
          if [ -n "$CI_TOKEN" ]; then
            git config --global url."https://x-access-token:${CI_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: check out the sibling repos (for the reference)
        run: |
          gh repo list handl-lang --limit 500 --visibility public --json name --jq '.[].name' \
            | grep -vx docs \
            | while read -r r; do
                git clone --depth 1 --quiet "https://github.com/handl-lang/$r" "../$r" || \
                  echo "::warning::could not clone $r"
                # the project docs live on each repo's `project` branch
                git clone --depth 1 --quiet -b project \
                  "https://github.com/handl-lang/$r" "../$r/project" 2>/dev/null || true
              done

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Same entry point a local bupha run uses: build the site and push
      # .vitepress/dist to gh-pages (the script drops the CI_TOKEN URL
      # rewrite so the push authenticates with GITHUB_TOKEN).
      - name: build the site and push gh-pages
        run: bash scripts/deploy-pages.sh
